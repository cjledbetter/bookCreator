<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self';" />
    <meta name="referrer" content="no-referrer" />
    <title>Book Creator — Visual Print PDF &amp; EPUB 3 Studio</title>
    <link data-trunk rel="rust" href="crates/book-app/Cargo.toml" data-cargo-crate="book-app" data-bin="book-creator" data-wasm-opt="z" />
    <style>
        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background-color: #181b22;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas#the_canvas_id {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .centered-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px auto;
            border: 4px solid rgba(56, 139, 253, 0.25);
            border-top-color: #388bfd;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered-loader" id="loading_text">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 600;">Loading Book Creator Studio…</h2>
        <p style="margin: 0; font-size: 13px; color: #94a3b8;">Preparing WebAssembly WYSIWYG Canvas, Print PDF &amp; EPUB 3.3 Exporters</p>
    </div>
</body>
</html>

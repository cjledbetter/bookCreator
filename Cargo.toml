[workspace]
resolver = "2"
members = [
    "crates/book-core",
    "crates/book-layout",
    "crates/book-pdf",
    "crates/book-epub",
    "crates/book-help",
    "crates/book-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Book Creator Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
cosmic-text = "0.12"
krilla = "0.4"
pdf-writer = "0.12"
